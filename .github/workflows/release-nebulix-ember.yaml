name: Release Nebulix Ember

permissions:
  id-token: write # necessary for publishing to npm
  pull-requests: write # necessary for writing comment on PR
  issues: write # necessary for commenting on released issues
  contents: write # necessary for publishing a GitHub release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run"
        type: boolean
        default: true

jobs:
  release:
    name: Release Nebulix Ember
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: ${{ inputs.dry_run }}
          semantic_version: 25
          extra_plugins: |
            @semantic-release/changelog@6
            @anolilab/semantic-release-pnpm@8
            @semantic-release/git@10
          extends: |
            @1024pix/conventional-changelog-pix@3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
