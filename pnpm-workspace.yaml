packages:
  - "ember/*"

overrides:
  "@glint/template": "1.9.0"

# kolay assumes POSIX path separators in two places, which breaks the docs
# build on Windows: it reads the wrong repl-sdk manifest path, and it builds
# the page tree from glob entries that come back with backslashes, so every
# page lands at the root and meta.jsonc ordering fails.
# Drop once the fix lands upstream and the pinned commit is bumped.
patchedDependencies:
  kolay: patches/kolay.patch

allowBuilds:
  "@parcel/watcher": false
  esbuild: true

# we don't want addons to be bad citizens of the ecosystem
autoInstallPeers: false

# we want true isolation, if a dependency is not declared, we want an error
resolvePeersFromWorkspaceRoot: false

# branches where packages are published
publishBranch: dev
