packages:
  - "ember/*"

overrides:
  "@glint/template": "1.9.0"

# kolay assumes POSIX path separators in two places, which breaks the docs build on Windows.
patchedDependencies:
  kolay: patches/kolay.patch

allowBuilds:
  "@parcel/watcher": false
  esbuild: true

# we don't want addons to be bad citizens of the ecosystem
autoInstallPeers: false

# we want true isolation, if a dependency is not declared, we want an error
resolvePeersFromWorkspaceRoot: false

# branches where packages are published
publishBranch: dev

# exclude pix libs from minimumReleaseAge to be coherent with Renovate policy
minimumReleaseAgeExclude:
  - "@1024pix/*"

# Define a catalog of version ranges.
catalog:
  ember-source: 7.3.1
