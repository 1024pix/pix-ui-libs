packages:
  - "core/*"
  - "ember/*"
  - "vue/*"

overrides:
  "@glint/template": "1.11.1"

# kolay assumes POSIX path separators in two places, which breaks the docs build on Windows.
patchedDependencies:
  kolay: patches/kolay.patch

allowBuilds:
  "@parcel/watcher": false
  esbuild: true

# we don't want addons to be bad citizens of the ecosystem
autoInstallPeers: false

# we want true isolation, if a dependency is not declared, we want an error
resolvePeersFromWorkspaceRoot: false

# branches where packages are published
publishBranch: dev

# exclude pix libs from minimumReleaseAge to be coherent with Renovate policy
minimumReleaseAgeExclude:
  - "@1024pix/*"

# Define a catalog of version ranges.
catalog:
  ember-source: 7.4.0
  "@glimmer/component": 2.2.1
  "@ember/test-helpers": 5.8.0
  "@babel/core": 7.29.13
  "@testing-library/dom": 10.4.2
  "@testing-library/user-event": 14.6.9
  vue: 3.5.45
  "@vue/compiler-dom": 3.5.45
  "@vue/server-renderer": 3.5.45
  vite: 8.3.8
  "@vitejs/plugin-vue": 6.0.11
  vue-tsc: 3.3.14
  vue-component-meta: 3.3.14
  typescript: 6.0.3
