# Configuration injected inside the `server { }` block generated by the Scalingo
# nginx buildpack: no `listen`, `server_name`, `access_log` nor `error_log` here.
# See https://github.com/Scalingo/nginx-buildpack

root /app/dist;

# Scalingo terminates TLS upstream and forwards the request in clear text.
if ($http_x_forwarded_proto != "https") {
    return 301 https://$host$request_uri;
}

add_header X-Content-Type-Options nosniff always;

# `gzip_types` replaces the inherited value instead of extending it, so the
# buildpack's own list is repeated here. The addition is `application/wasm`:
# the template compiler ships a 1.9 MB `.wasm` the default list ignores.
# `text/html` is always compressed and must not be listed.
gzip_types
  application/atom+xml
  application/javascript
  application/x-javascript
  application/json
  application/rss+xml
  application/vnd.ms-fontobject
  application/wasm
  application/x-font-ttf
  application/x-web-app-manifest+json
  application/xhtml+xml
  application/xml
  font/opentype
  image/svg+xml
  image/x-icon
  text/css
  text/plain
  text/x-component;

# `vite build` emits the test bundle, which has no business being public.
location /tests/ {
    return 404;
}

# `^~` on the three blocks below: a regex location wins over a plain prefix one,
# so without it the catch-all regex further down would swallow every asset and
# these cache headers would never be sent.
#
# `add_header` is not additive either: a location defining one drops the
# server-level headers, hence the repeated `X-Content-Type-Options`.
#
# `always` is deliberately absent from the `Cache-Control` headers: it would
# also stamp them on error responses, and a 404 hit during a deploy would then
# be cached for a year in the visitor's browser.

# Hashed filenames: safe to cache forever.
location ^~ /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Nebulix public assets, the Embroider vendor bundles and the API docs payload
# keep stable names across releases, so they must be revalidated rather than
# cached blindly.
location ^~ /@1024pix/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
}

location ^~ /@embroider/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
}

location ^~ /docs/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri =404;
}

location = /index.html {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}

# A missing asset must fail as a missing asset: without this, the SPA fallback
# below would answer `index.html` with a 200, and a missing font or icon sprite
# would silently render as HTML.
location ~* \.(js|css|woff2|wasm|svg|json|png|jpg|ico|map)$ {
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
