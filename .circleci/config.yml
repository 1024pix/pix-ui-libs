version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.0

workflows:
  version: 2
  build-and-test:
    jobs:
      - ci

jobs:
  ci:
    parameters:
      node-version:
        # renovate datasource=node-version depName=node
        default: 24.14.0
        type: string

    docker:
      - image: node:<<parameters.node-version>>
    resource_class: small
    environment:
      SHELL: bash
      PNPM_HOME: /root/.local/share/pnpm

    steps:
      - checkout
      - restore_cache:
          name: Restore pnpm Package Cache
          keys:
            - pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm package manager
          command: |
            curl -fsSL https://get.pnpm.io/install.sh | sh -
            echo 'export PATH="$PNPM_HOME/bin:$PATH"' >> "$BASH_ENV"
            "$PNPM_HOME/bin/pnpm" config set store-dir .pnpm-store
      - run:
          name: Install Dependencies
          command: |
            pnpm install
      - save_cache:
          name: Save pnpm Package Cache
          key: pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .pnpm-store
      - run:
          name: Lint addon files
          command: pnpm --filter @1024pix/nebulix-ember lint
      - run:
          name: Lint test-app files
          command: pnpm --filter test-app lint
      - browser-tools/install_chrome
      - run:
          name: Launch tests
          command: pnpm test
